<div class="login">
  <div class="login__card">
    <a routerLink="/" class="login__logo">Auto Prime</a>

    <h1>Entrar na sua conta</h1>
    <p class="login__subtitle">Acesse o painel para gerenciar clientes, veículos e vendas.</p>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <label for="email">E-mail</label>
      <input
        id="email"
        type="email"
        formControlName="email"
        placeholder="seuemail@autoprime.com.br"
        [class.input--erro]="emailInvalido"
      />
      @if (emailInvalido) {
        <p class="campo-erro">Informe um e-mail válido.</p>
      }

      <label for="senha">Senha</label>
      <input
        id="senha"
        type="password"
        formControlName="senha"
        placeholder="••••••••"
        [class.input--erro]="senhaInvalida"
      />
      @if (senhaInvalida) {
        <p class="campo-erro">A senha precisa ter no mínimo 6 caracteres.</p>
      }

      @if (erro()) {
        <p class="login__erro-geral">{{ erro() }}</p>
      }

      <button type="submit" [disabled]="carregando()">
        {{ carregando() ? 'Entrando...' : 'Entrar' }}
      </button>
    </form>

    <div class="login__test-accounts">
      <p class="login__test-title">💡 Contas Pré-cadastradas no Banco:</p>
      <div class="login__test-buttons">
        <button type="button" (click)="preencherCredenciais('joao@gmail.com', '123456')" class="btn-test btn-test--admin">
          👑 Admin (joao&#64;gmail.com)
        </button>
        <button type="button" (click)="preencherCredenciais('vendedor@gmail.com', '123456')" class="btn-test">
          💼 Vendedor (vendedor&#64;gmail.com)
        </button>
        <button type="button" (click)="preencherCredenciais('mariano@gmail.com', '123456')" class="btn-test">
          👤 Cliente (mariano&#64;gmail.com)
        </button>
      </div>
    </div>

    <!--
    <p class="login__rodape">
      Não tem uma conta? <a routerLink="/registro">Criar conta</a>
    </p>
    -->
  </div>
</div>
